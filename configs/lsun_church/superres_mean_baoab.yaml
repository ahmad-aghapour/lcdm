dataset:
  name: lsun_church
  input_dir: ../lsun_church_256_subset
  image_size: 256
  file_ext: png
  max_images: 1000
  center_crop: false

model:
  name: hf_diffusers
  pretrained_id: google/ddpm-ema-church-256
  use_fp16: false

task:
  name: superres

operator:
  name: mean_sr
  scale: 8

sampler:
  name: projected_ddim

warmup:
  name: underdamped
  splitting: baoab
  start_fraction: 0.75
  n_steps: 50
  friction: 0.5
  h_mul: 1.0
  init_noise_std: 1.0

sampling:
  batch_size: 8
  num_inference_steps: 200
  eta: 0.85
  seed: 42

output:
  dir: outputs/lsun_church_superres_mean_baoab
