dataset:
  name: celebahq
  input_dir: ../celabhq_test
  image_size: 256
  file_ext: png
  max_images: 1000
  center_crop: true

model:
  name: celeba_custom
  checkpoint: celeba_hq.ckpt
  use_fp16: false

task:
  name: superres

operator:
  name: mean_sr
  scale: 8

sampler:
  name: ddnm

sampling:
  batch_size: 8
  num_inference_steps: 200
  eta: 0.85
  seed: 42

output:
  dir: outputs/celebahq_superres_mean_ddnm
